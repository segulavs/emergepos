apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pos-system

resources:
- ../../namespace.yaml
- ../../mongodb-pvc.yaml
- ../../mongodb-deployment.yaml
- ../../app-deployment.yaml
- ../../configmap.yaml
- ../../secrets.yaml
- ../../ingress.yaml
- ../../hpa.yaml

patchesStrategicMerge:
- production-patches.yaml

images:
- name: your-acr-name.azurecr.io/pos-system
  newTag: latest

replicas:
- name: pos-app
  count: 2
- name: mongodb
  count: 1