apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pos-system-dev

resources:
- ../../namespace.yaml
- ../../mongodb-pvc.yaml
- ../../mongodb-deployment.yaml
- ../../app-deployment.yaml
- ../../configmap.yaml
- ../../secrets.yaml

patchesStrategicMerge:
- development-patches.yaml

images:
- name: your-acr-name.azurecr.io/pos-system
  newTag: dev

replicas:
- name: pos-app
  count: 1
- name: mongodb
  count: 1

namePrefix: dev-