apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pos-app-hpa
  namespace: pos-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pos-app
  minReplicas: 1  # Scale down to 1 during low usage
  maxReplicas: 5  # Maximum replicas for cost control
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60   # 1 minute
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60