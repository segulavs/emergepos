version: '3.8'

services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: pos-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: pos-admin-2024
      MONGO_INITDB_DATABASE: pos_system
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  pos-app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: pos-app
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://admin:pos-admin-2024@mongodb:27017/pos_system?authSource=admin
      - DB_NAME=pos_system
      - JWT_SECRET=pos-system-jwt-secret-change-in-production
      - SUPER_ADMIN_KEY=stockmaster-admin-2024
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mongodb_data:
    driver: local

networks:
  pos-network:
    driver: bridge