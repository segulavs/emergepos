name: flutter_pos_app
description: Flutter POS mobile app with offline functionality
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage & Offline
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Connectivity & Sync
  connectivity_plus: ^5.0.2
  
  # JSON & Serialization
  json_annotation: ^4.8.1
  
  # Security & Auth
  flutter_secure_storage: ^9.0.0
  
  # Barcode Scanning
  mobile_scanner: ^3.5.6
  
  # Receipt Printing
  esc_pos_utils: ^1.1.0
  esc_pos_printer: ^4.0.4
  
  # Date & Time
  intl: ^0.19.0
  
  # Utils
  uuid: ^4.2.1
  path: ^1.8.3
  
  # UI Enhancements
  flutter_slidable: ^3.0.1
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/